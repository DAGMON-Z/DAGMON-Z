name: refresh profile

on:
  # Fastest schedule GitHub allows. Picks up new repos, CF results and activity.
  schedule:
    - cron: "*/5 * * * *"
  # "Run workflow" button on the Actions tab: refresh right now, on demand.
  workflow_dispatch:
  # New stats from the Profile Sync extension, data/, the template or the scripts rebuild immediately.
  push:
    branches: [main]
    paths:
      - "data/**"
      - "profile-sync/**"
      - "scripts/**"
      - "README.tpl.md"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the live capture reads past stats from it

      - name: Rebuild profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build.sh

      - name: Commit if anything changed
        run: |
          git add README.md assets data/site.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git config user.name  "dagmon-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh profile"
            # Something else (e.g. the Profile Sync extension) may have pushed
            # meanwhile: put this commit on top of it and try again. On a clash
            # in generated files, the ones just built win ("theirs" while rebasing).
            for i in 1 2 3; do
              git push && exit 0
              sleep $((i * 3))
              git pull --rebase -X theirs origin main
            done
            exit 1
          fi
