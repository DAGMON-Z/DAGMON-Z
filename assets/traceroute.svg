<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150">
  <style>
    .t { font: 14px 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; fill: #c0caf5; white-space: pre; }
    .dim { fill: #565f89; } .ok { fill: #9ece6a; } .cy { fill: #7dcfff; } .mag { fill: #bb9af7; }
    .l { opacity: 0; animation: show .01s forwards; }
    @keyframes show { to { opacity: 1; } }
  </style>
  <rect width="860" height="150" rx="12" fill="#1a1b26"/>
  <text x="24" y="32" class="t"><tspan class="ok">❯</tspan> traceroute you</text>
  <text x="24" y="58" class="t l" style="animation-delay:.6s"> 1  <tspan class="cy">github.com</tspan>        <tspan class="dim">0.8 ms</tspan></text>
  <text x="24" y="80" class="t l" style="animation-delay:1.1s"> 2  <tspan class="cy">codeforces.com</tspan>    <tspan class="dim">2.1 ms</tspan></text>
  <text x="24" y="102" class="t l" style="animation-delay:1.6s"> 3  <tspan class="cy">tryhackme.com</tspan>     <tspan class="dim">3.7 ms</tspan></text>
  <text x="24" y="124" class="t l" style="animation-delay:2.1s"> 4  <tspan class="mag">you are here ✦  thanks for visiting</tspan></text>
</svg>
